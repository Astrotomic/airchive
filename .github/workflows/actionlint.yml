name: actionlint

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.12
