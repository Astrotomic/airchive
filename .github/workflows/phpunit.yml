name: phpunit

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip
      - run: composer install --prefer-dist --no-interaction --no-scripts
      - run: vendor/bin/phpunit
